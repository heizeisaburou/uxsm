# Run the same checks as the pre-commit hook on every push, and the VM suite
# where it matters: on main, on a version tag, and on demand. The VM job takes
# minutes and needs KVM, which GitHub runners do have, so branches and pull
# requests get the cheap checks and production gets the whole thing in public.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      distros:
        description: "make test-vm distributions: quick, pair, all, or a list"
        default: quick

jobs:
  check:
    name: gofmt, vet, unit tests, and script syntax
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      # Use the Go version from go.mod, the oldest uxsm supports, matching the
      # version used to build on Ubuntu 24.04 (docs/development.md).
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          # uxsm uses only the standard library, so there is no go.sum and no
          # dependency cache to populate.
          cache: false
      - run: make check
      - run: make build

  vm:
    name: packages and integration tests in virtual machines
    # On main and on a version tag, every distribution: that is what someone
    # looking at the repository sees. Elsewhere, only when asked.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      # VMs require KVM: without it, QEMU emulates the CPU and takes hours.
      - name: check KVM
        run: |
          test -e /dev/kvm || { echo "this runner has no /dev/kvm"; exit 1; }
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils cloud-image-utils
      - run: make test-vm DISTROS=${{ inputs.distros || 'all' }}

  nixos:
    name: the declared NixOS machine
    # Same trigger as the VM job: NixOS is not an extra, it is the sixth
    # distribution, and the only one where nothing sits where the others put it.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      # The machine is built and booted by Nix itself, so the runner needs Nix
      # and KVM, not QEMU of its own.
      - name: check KVM
        run: |
          test -e /dev/kvm || { echo "this runner has no /dev/kvm"; exit 1; }
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - run: make test-nixos
