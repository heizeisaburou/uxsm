# Run the same checks as the pre-commit hook on every push, plus optional VM
# checks. VM checks take minutes and require KVM, so they do not run automatically.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      distros:
        description: "Distribuciones de make test-vm: quick, pair, all o una lista"
        default: quick

jobs:
  check:
    name: gofmt, vet, pruebas unitarias y sintaxis de los scripts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      # Use the Go version from go.mod, the oldest uxsm supports, matching the
      # version used to build on Ubuntu 24.04 (docs/development.md).
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          # uxsm uses only the standard library, so there is no go.sum and no
          # dependency cache to populate.
          cache: false
      - run: make check
      - run: make build

  vm:
    name: paquetes y pruebas de integración en máquinas virtuales
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      # VMs require KVM: without it, QEMU emulates the CPU and takes hours.
      - name: comprobar KVM
        run: |
          test -e /dev/kvm || { echo "este runner no tiene /dev/kvm"; exit 1; }
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: dependencias
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils cloud-image-utils
      - run: make test-vm DISTROS=${{ inputs.distros }}
