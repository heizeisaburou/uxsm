---
# Run the same checks as the pre-commit hook on every push, and the VM suite
# where it matters: on main, on a version tag, and on demand. The VM job takes
# minutes and needs KVM, which GitHub runners do have, so branches and pull
# requests get the cheap checks and production gets the whole thing in public.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      distros:
        description: "make test-vm distributions: quick, pair, all, or a list"
        default: quick

jobs:
  check:
    name: gofmt, vet, unit tests, and script syntax
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      # Use the Go version from go.mod, the oldest uxsm supports, matching the
      # version used to build on Ubuntu 24.04 (docs/development.md).
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          # uxsm uses only the standard library, so there is no go.sum and no
          # dependency cache to populate.
          cache: false
      - run: make check
      - run: make build

  distros:
    name: distributions to test
    # On main and on a version tag, every distribution: that is what someone
    # looking at the repository sees. Elsewhere, only when asked.
    if: >-
      github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - uses: actions/checkout@v5
      # With UXSM_VM_CACHE off, nothing reads the prepared images, so they go
      # now instead of taking up the repository's cache until GitHub evicts
      # them.
      - if: ${{ !vars.UXSM_VM_CACHE }}
        name: empty the VM cache
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh cache list --key vm- --limit 100 --json id --jq '.[].id' |
            xargs -r -n1 gh cache delete
      # release.sh says what quick, pair, and all mean, so they are defined in
      # one place. NixOS has its own job below, with Nix instead of QEMU.
      - id: list
        env:
          DISTROS: ${{ inputs.distros || 'all' }}
        run: |
          list=$(test/release.sh --list "$DISTROS" | grep -vx nixos | sed 's/.*/"&"/' | paste -sd, -)
          echo "list=[$list]" >>"$GITHUB_OUTPUT"

  vm:
    name: ${{ matrix.distro }}, package and integration tests
    needs: distros
    # Asking for NixOS alone leaves no distribution for this job.
    if: needs.distros.outputs.list != '[]'
    # One job per distribution, each on its own runner with its own KVM: they
    # run at the same time, and each one's result shows on its own instead of
    # one failure hiding how the others went.
    strategy:
      fail-fast: false
      matrix:
        distro: ${{ fromJSON(needs.distros.outputs.list) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Deleting the previous cache entry of a distribution needs write access
    # to the repository's caches.
    permissions:
      contents: read
      actions: write
    env:
      # A runner starts empty and is thrown away, so the VMs start from the
      # cloud image (UXSM_VM_FRESH) rather than from a prepared image made only
      # to be thrown away with it. Both were measured on 2026-10-16: making it
      # updates the whole system, and the run went from 5m17s to 6m51s, with
      # Fedora from 3.1 to 6.7 minutes; only Ubuntu and openSUSE gained. The
      # repository variable UXSM_VM_CACHE keeps the images in GitHub's cache
      # instead, for a series of pushes close together: it is off by default
      # because it takes gigabytes of the repository's 10 GB, and turning it
      # off empties it (the distros job).
      UXSM_VM_FRESH: ${{ !vars.UXSM_VM_CACHE && '1' || '' }}
    steps:
      # The whole history and its tags: the package version comes from git
      # describe, and a shallow clone without tags makes it 0.0.0.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # VMs require KVM: without it, QEMU emulates the CPU and takes hours.
      - name: check KVM
        run: |
          test -e /dev/kvm || { echo "this runner has no /dev/kvm"; exit 1; }
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils cloud-image-utils
      # Only the key and the prepared image: the cloud image is not needed once
      # the image is made, and leaving it out saves space in the cache.
      - if: vars.UXSM_VM_CACHE
        id: restore
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cache/uxsm/vm/key
            ~/.cache/uxsm/vm/key.pub
            ~/.cache/uxsm/vm/prepared
          key: vm-${{ matrix.distro }}-${{ github.run_id }}
          restore-keys: vm-${{ matrix.distro }}-
      - run: make test-vm DISTROS=${{ matrix.distro }}
      # An entry cannot be overwritten, so an updated image is saved under a
      # new key, the time of its update, and the old entry is deleted: entries
      # would otherwise pile up until GitHub evicts them. Saved even when the
      # tests fail, since the image is not what they test.
      - if: vars.UXSM_VM_CACHE && !cancelled()
        id: image
        env:
          DISTRO: ${{ matrix.distro }}
          OLD: ${{ steps.restore.outputs.cache-matched-key }}
        run: |
          updated=$(cat ~/.cache/uxsm/vm/prepared/"$DISTRO".updated 2>/dev/null) || exit 0
          key=vm-$DISTRO-$updated
          if [ "$key" != "$OLD" ]; then echo "key=$key" >>"$GITHUB_OUTPUT"; fi
      - if: steps.image.outputs.key
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cache/uxsm/vm/key
            ~/.cache/uxsm/vm/key.pub
            ~/.cache/uxsm/vm/prepared
          key: ${{ steps.image.outputs.key }}
      - if: steps.image.outputs.key && steps.restore.outputs.cache-matched-key
        env:
          GH_TOKEN: ${{ github.token }}
          OLD: ${{ steps.restore.outputs.cache-matched-key }}
        run: gh cache delete "$OLD"
      # The runner is gone when the job ends, and with it the run's log and
      # the console and journal of a failed VM: keep them for two weeks, pass
      # or fail, so any run can be read after the fact. Nothing of anyone's
      # is on a runner, unlike the logs of a local run, which stay there.
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: logs-${{ matrix.distro }}
          path: build/logs/
          retention-days: 14

  nixos:
    name: the declared NixOS machine
    # Same trigger as the VM job: NixOS is not an extra, it is the sixth
    # distribution, and the only one where nothing sits where the others put it.
    if: >-
      github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      # The machine is built and booted by Nix itself, so the runner needs Nix
      # and KVM, not QEMU of its own.
      - name: check KVM
        run: |
          test -e /dev/kvm || { echo "this runner has no /dev/kvm"; exit 1; }
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - run: make test-nixos
